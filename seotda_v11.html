<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>섯다 온라인</title>
<style>
:root{--bg:#2a1d12;--fg:#f4ead2;--cd:#3b2a1a;--mut:#c9b894;--ac:#c0392b;--gold:#e9c46a;--ln:#6b4e2e;--ok:#8bd17c;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
#app{max-width:640px;margin:0 auto;padding:10px}
h1{font-size:28px;margin:8px 0}
.box{background:var(--cd);border:1px solid var(--ln);border-radius:10px;padding:12px;margin:10px 0}
.mut{color:var(--mut);font-size:13px}
input{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--ln);background:#1c130b;color:var(--fg);width:100%;box-sizing:border-box;margin:4px 0}
button{font:inherit;font-weight:700;padding:10px 6px;border-radius:8px;border:2px solid #8a6a3c;background:linear-gradient(#e8d9a8,#c9b273);color:#3a2610;cursor:pointer}
button.p{background:linear-gradient(#e0584a,#a52a1f);border-color:#6e1a12;color:#fff}
button:disabled{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.row>*{flex:1;min-width:70px}
.tb{position:relative;height:min(78vw,400px);min-height:380px;border-radius:18px;border:6px solid #6b4e2e;background:radial-gradient(ellipse at center,#4f7a47,#2f5230);box-shadow:inset 0 0 40px #0006}
.st{position:absolute;text-align:center;background:#0005;border-radius:10px;padding:4px 6px;font-size:13px;min-width:84px}
.st.t{top:6px;left:50%;transform:translateX(-50%)}.st.l{left:6px;top:50%;transform:translateY(-50%)}.st.r{right:6px;top:50%;transform:translateY(-50%)}
.st.on{outline:3px solid var(--gold)}.st.d{opacity:.45}.st.w{outline:3px solid var(--ok)}
.st b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:96px}
.cds{display:flex;gap:3px;justify-content:center;margin-top:3px}
.nm{color:var(--gold);font-weight:700}
.cd{width:54px;height:auto;display:block}.cd.sm{width:38px}.big .cd{width:84px}
.cd.bk{width:38px;height:60px;border-radius:5px;border:2px solid #111;background:repeating-linear-gradient(45deg,#8e1d17,#8e1d17 5px,#2b0b09 5px,#2b0b09 10px)}
.ct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;pointer-events:none;text-align:center;padding:70px 100px 0}
.pot{font-size:22px;font-weight:800;color:var(--gold);text-shadow:0 2px 4px #000}
.stk{display:flex;gap:2px;align-items:flex-end;min-height:30px}.pc{display:flex;flex-direction:column-reverse}.pc i{display:block;width:20px;height:7px;margin-top:-3px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe082,#d4a017 65%,#8a6200);border:2px solid #7a5a00;box-sizing:border-box;box-shadow:0 1px 2px #0008}
@keyframes pop{from{transform:translateY(-16px) scale(.4);opacity:0}to{transform:none;opacity:1}}.pop{animation:pop .3s ease-out backwards}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{width:32px;height:32px;border-radius:50%;border:3px dashed #fff;background:var(--ac);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:11px;line-height:1;color:#fff}
.chip small{font-size:7px;font-weight:600;max-width:28px;overflow:hidden;white-space:nowrap}
.me{display:grid;grid-template-columns:auto 1fr;gap:8px;margin-top:10px}
.bt{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-content:start}
.lg{grid-column:1/3;background:#0006;border-radius:8px;padding:6px 8px;font-size:12px;min-height:44px;max-height:84px;overflow:auto;color:var(--mut)}
.win{color:var(--ok);font-weight:800}
details{font-size:13px}table{border-collapse:collapse;width:100%}td{border:1px solid var(--ln);padding:2px 6px}
.cds{perspective:500px}.cd{backface-visibility:hidden}
@keyframes dl{from{transform:translate(var(--dx,0),var(--dy,-150px)) rotate(-18deg) scale(.5);opacity:0}to{transform:none;opacity:1}}
@keyframes fl{from{transform:rotateY(90deg);opacity:.2}to{transform:none;opacity:1}}
.dl{animation:dl .5s cubic-bezier(.2,.8,.3,1) backwards}.fl{animation:fl .55s ease-out backwards}
.st.t .dl{--dy:70px}.st.l .dl{--dx:90px;--dy:0px}.st.r .dl{--dx:-90px;--dy:0px}
@media (prefers-reduced-motion:reduce){.dl,.fl{animation:none}}
.fc{position:fixed;left:0;top:0;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe082,#d4a017 60%,#8a6200);border:2px solid #7a5a00;pointer-events:none;z-index:50;box-shadow:0 2px 3px #0008}
.hc{transition:transform .15s;border-radius:6px}.hc.sel{transform:translateY(-10px);outline:3px solid var(--gold)}.hc.dm{opacity:.35}.big.c3 .cd{width:62px}
.mc{margin-top:8px;font-weight:800;color:var(--gold);text-align:center;background:#0006;border-radius:8px;padding:4px}
.pp{background:#3b2a1aee;border:2px solid #8a6a3c;border-radius:12px;padding:10px;margin-top:10px;text-align:center}.pt{font-weight:800;color:var(--gold);margin-bottom:6px}.po{display:flex;gap:8px;justify-content:center;margin-bottom:8px}.pc2{border:3px solid transparent;border-radius:10px;padding:4px;cursor:pointer;background:#0004}.pc2.on{border-color:var(--gold);background:#0008}.pp .cd{width:62px}.pp .combo .cd{width:44px}.tg{font-size:11px;text-align:center;color:var(--gold);font-weight:700}

function ev(h){const[a,b]=h,ma=(a>>1)+1,mb=(b>>1)+1,ga=!(a&1)&&[1,3,8].includes(ma),gb=!(b&1)&&[1,3,8].includes(mb),lo=Math.min(ma,mb),hi=Math.max(ma,mb),s=[a,b].sort((x,y)=>x-y).join();let r=null;
